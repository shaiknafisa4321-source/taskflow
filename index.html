<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks | TaskFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body class="dashboard-page">
    <header class="topbar">
        <a class="brand" href="/">TaskFlow<span>.</span></a>
        <div class="account-area">
            <span id="welcome-user">My workspace</span>
            <form action="{{ url_for('logout') }}" method="POST">
                <button class="logout-btn" type="submit">Log out</button>
            </form>
        </div>
    </header>
    <main class="dashboard">
        <section class="welcome-section">
            <div>
                <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
                <h1>Get things done.</h1>
                <p class="muted">Keep your day organized, one task at a time.</p>
            </div>
        </section>
        <section class="stats-grid">
            <article class="stat-card">
                <span>Total tasks</span>
                <strong id="total-count">0</strong>
            </article>
            <article class="stat-card">
                <span>In progress</span>
                <strong id="progress-count">0</strong>
            </article>
            <article class="stat-card">
                <span>Completed</span>
                <strong id="completed-count">0</strong>
            </article>
        </section>
        <section class="content-grid">
            <section class="panel task-form-panel">
                <h2 id="form-heading">Add a new task</h2>
                <p class="muted">Write down what you need to do.</p>
                <form id="task-form">
                    <input type="hidden" id="task-id">
                    <label for="title">Task title</label>
                    <input id="title" type="text" maxlength="150"
                           placeholder="e.g. Finish internship assignment" required>
                    <label for="description">Description</label>
                    <textarea id="description" rows="4"
                              placeholder="Add a few details..."></textarea>
                    <div class="form-row">
                        <div>
                            <label for="priority">Priority</label>
                            <select id="priority">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div>
                            <label for="due-date">Due date</label>
                            <input id="due-date" type="date">
                        </div>
                    </div>
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                    <div class="form-actions">
                        <button class="primary-btn" id="save-button" type="submit">
                            Add task
                        </button>
                        <button class="secondary-btn hidden" id="cancel-edit"
                                type="button">Cancel</button>
                    </div>
                </form>
            </section>
            <section class="panel tasks-panel">
                <div class="tasks-heading">
                    <div>
                        <h2>Your tasks</h2>
                        <p class="muted">Everything you need to keep track of.</p>
                    </div>
                </div>
                <div class="filter-row">
                    <input id="search-input" type="search"
                           placeholder="Search tasks...">
                    <select id="filter-status" aria-label="Filter by status">
                        <option value="All">All tasks</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <p id="message" role="status" aria-live="polite"></p>
                <div id="task-list" class="task-list"></div>
            </section>
        </section>
    </main>
</body>
</html>
